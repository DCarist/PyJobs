<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyJobs | Premium Job Scraper</title>
    <!-- Modern Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >
    <!-- CSS -->
    <link rel="stylesheet" href="/static/styles.css">
    <!-- HTMX -->
    <script
      src="https://unpkg.com/htmx.org@1.9.10"
      integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="container">
      <header class="app-header">
        <div class="header-brand">
          <a href="/" class="brand-link">
            <h1 class="brand-title">PyJobs</h1>
          </a>
          <p class="subtitle">Intelligent Job Curation & Application Tracker</p>
        </div>
        <nav class="top-nav" aria-label="Main Navigation">
          <a href="/" class="nav-tab {% if active_page == 'curation' %}active{% endif %}">
            <span>🌐 Discover & Curate</span>
          </a>
          <a
            href="/applications"
            class="nav-tab {% if active_page == 'applications' %}active{% endif %}"
          >
            <span>📋 Application Tracker</span>
          </a>
          <a
            href="/applications/unemployment-report"
            class="nav-tab {% if active_page == 'unemployment' %}active{% endif %}"
          >
            <span>📑 Work-Search Log</span>
          </a>
        </nav>
      </header>
      <main>{% block content %}{% endblock %}</main>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
