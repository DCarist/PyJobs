<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyJobs | Premium Job Scraper</title>
    <!-- Modern Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >
    <!-- CSS -->
    <link rel="stylesheet" href="/static/styles.css?v=3">
    <!-- HTMX -->
    <script
      src="https://unpkg.com/htmx.org@1.9.10"
      integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div
      id="save-status-toast"
      class="save-status-toast"
      style="position: fixed; top: 1.25rem; right: 1.5rem; z-index: 999999; pointer-events: none; display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem;"
      aria-live="polite"
    >
      {% if request and request.query_params.get('saved') %}
      <div
        class="save-status-badge"
        style="display: inline-flex; align-items: center; gap: 0.4rem; background: rgba(16, 185, 129, 0.95); color: #ffffff; border: 1px solid rgba(52, 211, 153, 0.6); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 14px rgba(16, 185, 129, 0.4); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 0.85rem; font-weight: 600; letter-spacing: 0.02em; padding: 0.45rem 1rem; border-radius: 9999px; pointer-events: none;"
      >
        ✓ {{ request.query_params.get('saved') }}
      </div>
      {% endif %}
    </div>
    <div class="container">
      <header class="app-header">
        <div class="header-brand">
          <a href="/" class="brand-link">
            <h1 class="brand-title">PyJobs</h1>
          </a>
          <p class="subtitle">Intelligent Job Curation & Application Tracker</p>
        </div>
        <nav class="top-nav" aria-label="Main Navigation">
          <a href="/" class="nav-tab {% if active_page == 'curation' %}active{% endif %}">
            <span>🌐 Discover & Curate</span>
          </a>
          <a
            href="/applications"
            class="nav-tab {% if active_page == 'applications' %}active{% endif %}"
          >
            <span>📋 Application Tracker</span>
          </a>
          <a
            href="/applications/unemployment-report"
            class="nav-tab {% if active_page == 'unemployment' %}active{% endif %}"
          >
            <span>📑 Work-Search Log</span>
          </a>
          <a href="/resumes" class="nav-tab {% if active_page == 'resumes' %}active{% endif %}">
            <span>📄 Resumes</span>
          </a>
        </nav>
      </header>
      <main>{% block content %}{% endblock %}</main>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
