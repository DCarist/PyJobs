<div class="actions-bar" id="job-actions-{{ job.id }}">
  {% if job.job_url %}
  <a
    href="{{ job.job_url }}"
    target="_blank"
    class="btn-primary btn-small btn-apply"
    title="Apply directly on job board or employer site"
  >
    Apply Here
  </a>
  {% endif %} {% set tracked_app = tracked_map.get(job.id) if tracked_map else None %} {% if
  tracked_app %}
  <span class="badge tracked-badge" title="Tracked in your Application Tracker">
    ✓ {{ tracked_app.status|capitalize }}
  </span>
  <a
    href="/applications/{{ tracked_app.id }}"
    class="btn-track-active btn-small"
    title="Open this application in the Tracker"
  >
    View Application
  </a>
  {% else %}
  <button
    type="button"
    class="btn-track btn-small"
    hx-post="/job/{{ job.id }}/track"
    hx-target="#job-actions-{{ job.id }}"
    hx-swap="outerHTML"
    title="Track this job in your Application Tracker"
  >
    📌 Track Application
  </button>
  <button
    type="button"
    class="btn-save-job btn-small"
    hx-post="/job/{{ job.id }}/track?status=saved"
    hx-target="#job-actions-{{ job.id }}"
    hx-swap="outerHTML"
    title="Save this job to apply later"
  >
    💾 Save Job
  </button>
  {% endif %}

  <button
    type="button"
    id="view-details-btn-{{ job.id }}"
    class="btn-details btn-small"
    onclick="toggleJobDetails('{{ job.id }}')"
    title="Toggle full job description"
  >
    View Details
  </button>

  {% if job.is_hidden %}
  <button
    type="button"
    class="btn-subtle btn-small btn-hide"
    hx-post="/job/{{ job.id }}/unhide"
    hx-target="#job-{{ job.id }}"
    hx-swap="outerHTML"
    title="Restore this posting to feed"
  >
    Unhide
  </button>
  {% else %}
  <button
    type="button"
    class="btn-subtle btn-small btn-hide"
    hx-post="/job/{{ job.id }}/hide"
    hx-target="#job-{{ job.id }}"
    hx-swap="outerHTML"
    title="Hide this posting from feed"
  >
    Hide
  </button>
  {% endif %}
</div>
