<div class="job-details-panel glass-panel">
  <div class="job-details-header">
    <span class="details-heading">Role Description</span>
    <button
      type="button"
      class="btn-subtle btn-small"
      onclick="closeJobDetails('{{ job.id }}')"
      title="Close details"
    >
      ✕ Close
    </button>
  </div>
  <div class="job-description-content markdown-body">
    {% if job.description %} {{ job.description | render_markdown | safe }} {% else %}
    <em class="no-description">No description available for this posting.</em>
    {% endif %}
  </div>
</div>
