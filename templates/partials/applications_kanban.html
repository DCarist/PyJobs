<div class="kanban-board" id="kanban-board">
  {% for col in kanban_columns %}
  <div class="kanban-column" id="column-{{ col.id }}" data-stage="{{ col.id }}">
    <div class="kanban-column-header {{ col.badge_class }}">
      <div class="column-title-group">
        <span class="column-icon">{{ col.icon }}</span>
        <h3 class="column-title">{{ col.title }}</h3>
      </div>
      <span class="badge column-count">{{ col.cards|length }}</span>
    </div>

    <div class="kanban-cards-list" data-stage="{{ col.id }}">
      {% if col.cards %} {% for app in col.cards %} {% include "partials/application_card.html" %}
      {% endfor %} {% else %}
      <div class="empty-column-placeholder">
        <span>No applications in this stage</span>
      </div>
      {% endif %}
    </div>
  </div>
  {% endfor %}
</div>
