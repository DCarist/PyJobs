[project]
name = "pyjobs"
version = "0.2.0"
description = "Intelligent Job Curation & Application Tracker"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "docx2pdf>=0.1.8",
    "fastapi>=0.136.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown>=3.10.3",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pymupdf>=1.25.0",
    "python-docx>=1.1.2",
    "python-jobspy>=1.1.82",
    "python-multipart>=0.0.26",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.44.0",
]

[project.scripts]
pyjobs = "pyjobs.launcher:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["uploads", ".venv", ".git"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008", # do not perform function calls in argument defaults (standard in FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["pyjobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
norecursedirs = ["uploads", ".venv", ".git"]

